# coturn relay for HEWAL3 calls. Run it on a public server (a small VPS is enough); calls only use it when two phones cannot
# connect directly. Replace the three values marked CHANGE, open the ports below in the server firewall, then set on the API:
#   TURN_URLS=turn:turn.example.com:3478?transport=udp,turn:turn.example.com:3478?transport=tcp
#   TURN_SECRET=<the same value as static-auth-secret below>
# Generate a secret with:  openssl rand -hex 32

listening-port=3478
# CHANGE: the server's public IP address (and private one if it sits behind NAT, as "public/private")
external-ip=203.0.113.10
# CHANGE: your domain; used in the credentials realm
realm=turn.example.com

# Time-limited credentials: the API signs a username that contains an expiry time, so nothing permanent is ever sent to a phone.
use-auth-secret
# CHANGE: a long random value, identical to TURN_SECRET on the API
static-auth-secret=CHANGE_ME_LONG_RANDOM_SECRET

fingerprint
no-multicast-peers
no-cli
# Do not let a caller use the relay to reach private networks (stops it being used to probe the server's own network)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Relay ports for the media itself; open this UDP range in the firewall too
min-port=49160
max-port=49200
# Limits so one person cannot use all the bandwidth
user-quota=4
total-quota=200
stale-nonce=600
