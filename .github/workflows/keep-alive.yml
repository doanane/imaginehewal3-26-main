name: Keep the hosted service awake

# Visits the live service every 10 minutes so free hosting does not put it to sleep (it sleeps after about 15 minutes without a visit).
# GitHub may run a scheduled job a few minutes late, which is why the service also pings itself while it is awake.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the service
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -m 90 -w "%{http_code}" https://imaginehewal3-26-main.onrender.com/ping || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
